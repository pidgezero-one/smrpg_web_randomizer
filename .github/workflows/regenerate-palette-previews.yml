name: Regenerate Palette Previews

on:
  push:
    branches:
      - master
      - v9-wip
    paths:
      # Only run when palette files are changed
      - 'randomizer/data/allies/palettes/**/*.py'

jobs:
  regenerate-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install -r requirements.txt

      - name: Generate palette previews
        run: |
          python manage.py generate_palette_previews --skip-checks

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet randomizer/static/randomizer/images/palette_previews/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add randomizer/static/randomizer/images/palette_previews/
          git commit -m "Auto-regenerate palette preview images [skip ci]"
          git push
