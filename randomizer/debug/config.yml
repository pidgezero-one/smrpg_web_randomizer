# Debug mode config
# This file is only read when debug_mode is enabled.
#
# items.start: List of item class names from randomizer/data/items
#   These items will be added to the player's inventory at game start.
#
# items.override: Map of location class names to prize class names
#   Location classes are from randomizer/progression/prizelocations.py
#   Prize classes are from randomizer/progression/prizes.py
#   These locations will have their prizes hard-set before shuffling.
#
# invisible_flags: List of exactly 3 InvisibleFlagLocation class names
#   These are the locations chosen for the Dry Bones, Greaper, and Big Boo flags.
#   Class names are from randomizer/progression/prizelocations.py (e.g., MariosPadChimneyFlag)

# starting_coins: Number of coins to start with (0-9999). Default: 9999
starting_coins: 9999

# starting_frog_coins: Number of frog coins to start with (0-255). Default: 99
starting_frog_coins: 99

# items:
  # Override specific locations with specific prizes for chest packet testing
  # override:
items:
  start:
    - SafetyRingItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
    - RockCandyItem
  override:
    StartingItem1Location: MarioDollPrize
    StartingItem2Location: BambinoBombPrize
    StartingItem3Location: CastleKey1Prize
    StartingItem4Location: CastleKey2Prize